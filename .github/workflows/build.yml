name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Runs the end-to-end test on demand, from the Actions tab.
  workflow_dispatch:

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: lasso-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # The whole flow on an emulator. Slow (several minutes), so only for releases and on demand.
  e2e:
    name: End-to-end test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          # On failure, save the device log for the report.
          script: ./gradlew connectedDebugAndroidTest || (adb logcat -d > app/build/reports/androidTests/logcat.txt; exit 1)

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: app/build/reports/androidTests/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK and App Bundle
        env:
          LASSO_KEYSTORE_BASE64: ${{ secrets.LASSO_KEYSTORE_BASE64 }}
          LASSO_KEYSTORE_PASSWORD: ${{ secrets.LASSO_KEYSTORE_PASSWORD }}
          LASSO_KEY_ALIAS: ${{ secrets.LASSO_KEY_ALIAS }}
        run: |
          if [ -z "$LASSO_KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing. Add LASSO_KEYSTORE_BASE64, LASSO_KEYSTORE_PASSWORD and LASSO_KEY_ALIAS in the repo settings."
            exit 1
          fi
          export LASSO_KEYSTORE="$RUNNER_TEMP/lasso-release.jks"
          echo "$LASSO_KEYSTORE_BASE64" | base64 --decode > "$LASSO_KEYSTORE"
          ./gradlew assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "Lasso-$GITHUB_REF_NAME.apk"
          # For uploading to Google Play; it can't be installed directly.
          cp app/build/outputs/bundle/release/app-release.aab "Lasso-$GITHUB_REF_NAME.aab"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Lasso-$GITHUB_REF_NAME.apk" "Lasso-$GITHUB_REF_NAME.aab" --title "Lasso $GITHUB_REF_NAME" --generate-notes
