name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lasso-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        env:
          LASSO_KEYSTORE_BASE64: ${{ secrets.LASSO_KEYSTORE_BASE64 }}
          LASSO_KEYSTORE_PASSWORD: ${{ secrets.LASSO_KEYSTORE_PASSWORD }}
          LASSO_KEY_ALIAS: ${{ secrets.LASSO_KEY_ALIAS }}
        run: |
          if [ -z "$LASSO_KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing. Add LASSO_KEYSTORE_BASE64, LASSO_KEYSTORE_PASSWORD and LASSO_KEY_ALIAS in the repo settings."
            exit 1
          fi
          export LASSO_KEYSTORE="$RUNNER_TEMP/lasso-release.jks"
          echo "$LASSO_KEYSTORE_BASE64" | base64 --decode > "$LASSO_KEYSTORE"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Lasso-$GITHUB_REF_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Lasso-$GITHUB_REF_NAME.apk" --title "Lasso $GITHUB_REF_NAME" --generate-notes
